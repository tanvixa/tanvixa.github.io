<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Find Tanvixa products using the product code shown in our videos."
    >

    <meta
        name="robots"
        content="index, follow"
    >

    <title>Tanvixa — Find Your Product</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

    <link
        rel="icon"
        href="./images/tanvixalogo.jpg"
    >

</head>

<body>

<header class="site-header">

    <div class="header-container">

        <a
            href="./index.html"
            class="logo-link"
        >
            <img
                src="./images/tanvixalogo.jpg"
                alt="Tanvixa"
                class="site-logo"
            >
        </a>

        <nav class="main-nav">
            <a href="./index.html">
                Home
            </a>
        </nav>

    </div>

</header>


<main class="main-content">

    <section class="search-section">

        <div class="search-container">

            <h1>
                Find Your Product
            </h1>

            <p class="search-subtitle">
                Enter the product code shown in our video.
            </p>


            <div class="search-box">

                <input
                    type="text"
                    id="productCode"
                    placeholder="Enter Product Code (Example: GL001)"
                    autocomplete="off"
                    spellcheck="false"
                >

                <button
                    type="button"
                    id="searchButton"
                >
                    Search
                </button>

            </div>


            <div
                id="searchMessage"
                class="search-message"
                aria-live="polite"
            ></div>

        </div>

    </section>


    <section
        id="searchResult"
        class="product-result"
    ></section>


    <section
        id="recentProducts"
        class="recent-products"
    ></section>

</main>


<footer class="site-footer">

    <p>
        Some links on this website may be affiliate links.
        If you make a purchase through these links, we may earn
        a commission at no extra cost to you.
    </p>

    <p>
        © 2026 Tanvixa. All rights reserved.
    </p>

</footer>


<script src="./script.js" defer></script>

</body>
</html>
