<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="View detailed product information on Tanvixa."
    >

    <meta
        name="robots"
        content="index, follow"
    >

    <title>Product — Tanvixa</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

    <link
        rel="icon"
        href="./images/tanvixalogo.jpg"
    >

</head>

<body>


<header class="site-header">

    <div class="header-container">

        <a
            href="./index.html"
            class="logo-link"
        >

            <img
                src="./images/tanvixalogo.jpg"
                alt="Tanvixa"
                class="site-logo"
            >

        </a>


        <nav class="main-nav">

            <a href="./index.html">
                Home
            </a>

        </nav>

    </div>

</header>



<main class="main-content">

    <section
        id="productPage"
        class="product-page-container"
    >

        <!--
        Product will be rendered here immediately
        from sessionStorage/localStorage when available.
        -->

        <div class="product-loading">

            <div class="loading-spinner"></div>

            <p>
                Opening product...
            </p>

        </div>

    </section>


    <section
        id="relatedProducts"
        class="related-products"
    ></section>

</main>



<footer class="site-footer">

    <p>
        Some links on this website may be affiliate links.
        If you make a purchase through these links, we may earn
        a commission at no extra cost to you.
    </p>

    <p>
        © 2026 Tanvixa. All rights reserved.
    </p>

</footer>



<script src="./script.js" defer></script>

</body>
</html>
